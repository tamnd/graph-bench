name: Nightly cross-engine matrix

# Tier-1 nightly (spec 09 §5): stand up each Bolt-plane engine at its pinned
# image, run the smoke workloads for real, and run the gate against checked-in
# baselines. Image tags here mirror engine/pins.go — bump both together.
on:
  schedule:
    # Run at 02:00 UTC every day.
    - cron: "0 2 * * *"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

jobs:
  matrix:
    name: cross-engine (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: neo4j
            image: neo4j:2026.06.0-community
          - engine: memgraph
            image: memgraph/memgraph-mage:3.10.0

    services:
      engine:
        image: ${{ matrix.image }}
        env:
          NEO4J_AUTH: ${{ matrix.engine == 'neo4j' && 'neo4j/benchbench' || '' }}
        ports:
          - "7687:7687"
          - "7474:7474"
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/7687' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build (bolt tag)
        run: go build -tags bolt ./...

      - name: test (bolt tag, integration on)
        run: go test -tags bolt ./engine/... -timeout 15m
        env:
          GRAPH_BENCH_BOLT_IT: "1"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASS: benchbench
          MEMGRAPH_URI: bolt://localhost:7687

      - name: smoke run
        run: |
          go run -tags bolt ./cmd/graph-bench run \
            --workload micro-grid --engines ${{ matrix.engine }} \
            --count 30 --out /tmp/results
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASS: benchbench
          MEMGRAPH_URI: bolt://localhost:7687

  zu:
    name: cross-engine (zu, subprocess plane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build zu from source
        run: |
          git clone --depth 1 https://github.com/tamnd/zu.git /tmp/zu
          cd /tmp/zu && cargo build --release -p zu-cli
        continue-on-error: true
        id: zubuild

      - name: smoke run (primitive mode)
        if: steps.zubuild.outcome == 'success'
        run: |
          go run ./cmd/graph-bench run \
            --workload micro-grid --engines zu --count 30 --out /tmp/results
        env:
          ZU_BIN: /tmp/zu/target/release/zu
